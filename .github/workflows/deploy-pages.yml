name: GitHub Pages 배포

# 저장소에 push될 때마다(= 랭킹이 갱신될 때마다) 정적 사이트를 그대로 배포합니다.
# 빌드 도구가 없으므로 저장소 폴더를 통째로 올리기만 하면 끝입니다.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 안 켜져 있으면 이 워크플로가 직접 켭니다.
          # (실패하면 Settings > Pages > Source 를 "GitHub Actions"로 직접 선택하세요)
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
