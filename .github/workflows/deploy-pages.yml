name: GitHub Pages 배포

# 정적 사이트를 그대로 배포합니다. 빌드 도구가 없으므로 저장소 폴더를 통째로 올립니다.
#
# workflow_call 이 있는 이유:
#   GitHub은 Actions가 GITHUB_TOKEN으로 만든 커밋으로는 다른 워크플로를 다시
#   실행시키지 않습니다(무한 루프 방지). 그래서 랭킹 갱신·자동 등록이 데이터를
#   커밋해도 push 이벤트가 발생하지 않아 배포가 걸리지 않습니다.
#   각 데이터 워크플로가 커밋을 마친 뒤 이 워크플로를 직접 호출하게 해서 해결합니다.
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # 호출한 워크플로가 방금 커밋한 내용까지 배포하려면 기본 브랜치의 최신을 받아야 합니다.
          # (호출 시점의 SHA를 그대로 쓰면 커밋 이전 상태가 배포됩니다)
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
        with:
          # 저장소에 Pages가 아직 안 켜져 있으면 이 워크플로가 직접 켭니다.
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - id: deployment
        uses: actions/deploy-pages@v4
