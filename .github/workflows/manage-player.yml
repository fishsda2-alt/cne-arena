name: 선수 관리 (승인/보류/삭제)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "작업"
        type: choice
        required: true
        options: [approve, hold, remove]
        default: approve
      who:
        description: "선수 ID(p001) 또는 Riot ID(홍길동#KR1)"
        required: true

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 처리
        env:
          IN_WHO: ${{ inputs.who }}
        run: python scripts/manage_player.py "${{ inputs.action }}" --who "$IN_WHO"

      - name: 커밋
        env:
          IN_WHO: ${{ inputs.who }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 선수 ${{ inputs.action }} — $IN_WHO"
            git push
          fi
