name: 선수 관리 (승인/보류/수정/삭제)

# ⚠ 실명·연락처·이메일은 절대 입력하지 마세요. 실행 기록이 공개됩니다.
on:
  workflow_dispatch:
    inputs:
      action:
        description: "작업 (pro=★켜기, unpro=★끄기, edit=프로필 수정, drop=종목만 해지, remove=완전 삭제)"
        type: choice
        required: true
        options: [approve, hold, pro, unpro, edit, drop, remove]
        default: approve
      who:
        description: "선수 ID(p001) 또는 Riot ID(홍길동#KR1)"
        required: true
      name:
        description: "[edit] 새 표시 닉네임 — 실명 금지"
        required: false
      team:
        description: "[edit] 새 소속"
        required: false
      region:
        description: "[edit] 새 지역"
        required: false
      position:
        description: "[edit] 새 주 포지션"
        required: false
      game:
        description: "[edit/drop] 대상 종목"
        type: choice
        options: [lol, val]
        default: lol

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 처리
        env:
          IN_WHO: ${{ inputs.who }}
          IN_NAME: ${{ inputs.name }}
          IN_TEAM: ${{ inputs.team }}
          IN_REGION: ${{ inputs.region }}
          IN_POSITION: ${{ inputs.position }}
          IN_GAME: ${{ inputs.game }}
        run: |
          python scripts/manage_player.py "${{ inputs.action }}" \
            --who "$IN_WHO" \
            --name "$IN_NAME" \
            --team "$IN_TEAM" \
            --region "$IN_REGION" \
            --position "$IN_POSITION" \
            --game "$IN_GAME"

      - name: 커밋
        env:
          IN_WHO: ${{ inputs.who }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 선수 ${{ inputs.action }} — $IN_WHO"
            git push
          fi

  deploy:
    needs: manage
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
