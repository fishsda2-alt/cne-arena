name: 스타크래프트 본인 등록

# scr.html 에서 선수가 스크린샷과 대조해 확인한 값만 들어옵니다.
# 스크린샷 파일은 오지 않습니다 — 글자 인식은 선수 브라우저 안에서 끝납니다.
#
# 블리자드 공식 API가 없어 이 값은 검증할 수 없습니다.
# 그래서 화면에 [본인 등록 / 날짜] 로 표시하고, 롤 랭킹과 파일을 따로 둡니다.
#
# 들어오는 값은 외부 입력이므로 반드시 env로 전달합니다 — run: 안에 ${{ }}를 직접 쓰면
# 셸 명령이 주입될 수 있습니다.
on:
  repository_dispatch:
    types: [scr-report]
  # 운영자: 잘못 올라온 기록 지우기 (Actions 탭 → 이 워크플로 → Run workflow)
  workflow_dispatch:
    inputs:
      remove:
        description: "삭제할 기록 — 순번(s001) 또는 게임 아이디"
        required: true

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 본인 등록 반영
        if: github.event_name == 'repository_dispatch'
        env:
          IN_SCR_ID: ${{ github.event.client_payload.scrId }}
          IN_NAME: ${{ github.event.client_payload.nickname }}
          IN_REGION: ${{ github.event.client_payload.region }}
          IN_RACE: ${{ github.event.client_payload.race }}
          IN_TEAM: ${{ github.event.client_payload.team }}
          IN_GRADE: ${{ github.event.client_payload.grade }}
          IN_RATING: ${{ github.event.client_payload.rating }}
          IN_WINS: ${{ github.event.client_payload.wins }}
          IN_LOSSES: ${{ github.event.client_payload.losses }}
          IN_LADDER_RANK: ${{ github.event.client_payload.ladderRank }}
        run: |
          set -o pipefail
          python scripts/scr_report.py \
            --scr-id "$IN_SCR_ID" \
            --name "$IN_NAME" \
            --region "$IN_REGION" \
            --race "$IN_RACE" \
            --team "$IN_TEAM" \
            --grade "$IN_GRADE" \
            --rating "$IN_RATING" \
            --wins "$IN_WINS" \
            --losses "$IN_LOSSES" \
            --ladder-rank "$IN_LADDER_RANK" 2>&1 | tee /tmp/scr-out.txt

      - name: 기록 삭제
        if: github.event_name == 'workflow_dispatch'
        env:
          IN_REMOVE: ${{ inputs.remove }}
        run: |
          set -o pipefail
          python scripts/scr_report.py --remove "$IN_REMOVE" 2>&1 | tee /tmp/scr-out.txt

      # 로그를 펼치지 않아도 실행 요약 화면에서 결과를 바로 볼 수 있게 합니다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 스타크래프트 본인 등록 결과"
            echo ""
            echo '```'
            cat /tmp/scr-out.txt 2>/dev/null || echo "(스크립트가 실행되기 전에 중단되었습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ranking.scr.json
          if git diff --staged --quiet; then
            echo "변경 없음"
          else
            git commit -m "chore: 스타크래프트 본인 등록 반영"
            git push
          fi

  # 데이터 커밋만으로는 Pages 배포가 걸리지 않으므로 직접 호출합니다.
  deploy:
    needs: report
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
