name: 사이트 대회 제보

# 대회 안내 페이지의 제보 폼에서 들어옵니다.
#
# 선수 등록·수정·삭제는 아이콘으로 본인을 확인하지만, 대회 제보는 확인할 대상이
# 없습니다. 그래서 **승인 대기 상태로만 쌓이고 화면에는 나오지 않습니다.**
# 운영 현황(?manage)에서 관리 키로 승인해야 노출됩니다.
#
# 접수 링크·포스터 주소는 scripts/events.py 가 https 인지 검사합니다 —
# javascript: 로 시작하는 주소는 눌렀을 때 코드가 실행됩니다.
on:
  repository_dispatch:
    types: [submit-event]

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 제보 접수
        env:
          IN_NAME: ${{ github.event.client_payload.name }}
          IN_HOST: ${{ github.event.client_payload.host }}
          IN_GAME: ${{ github.event.client_payload.game }}
          IN_START: ${{ github.event.client_payload.start }}
          IN_END: ${{ github.event.client_payload.end }}
          IN_APPLY: ${{ github.event.client_payload.applyBy }}
          IN_URL: ${{ github.event.client_payload.url }}
          IN_POSTER: ${{ github.event.client_payload.poster }}
          IN_NOTE: ${{ github.event.client_payload.note }}
        run: |
          set -o pipefail
          python scripts/events.py add \
            --name "$IN_NAME" \
            --host "$IN_HOST" \
            --game "$IN_GAME" \
            --start "$IN_START" \
            --end "$IN_END" \
            --apply-by "$IN_APPLY" \
            --url "$IN_URL" \
            --poster "$IN_POSTER" \
            --note "$IN_NOTE" 2>&1 | tee /tmp/event-out.txt

      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 대회 제보 결과"
            echo ""
            echo '```'
            cat /tmp/event-out.txt 2>/dev/null || echo "(스크립트가 실행되기 전에 중단되었습니다)"
            echo '```'
            echo ""
            echo "승인은 운영 현황 페이지에서 합니다."
          } >> "$GITHUB_STEP_SUMMARY"

      # 승인 전에는 화면에 나오지 않으므로 배포를 서두를 이유가 없지만,
      # 저장소와 사이트가 어긋나 있으면 승인할 때 혼란스러워집니다.
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/events.json
          git diff --staged --quiet || git commit -m "chore: 사이트에서 대회 제보 접수"
          git push

  deploy:
    needs: submit
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
