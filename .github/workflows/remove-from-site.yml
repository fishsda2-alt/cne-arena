name: 사이트 등록 삭제

# 삭제 페이지에서 선수가 제출하면 Google Apps Script가 이 워크플로를 깨웁니다.
#
# 되돌릴 수 없는 동작이라 인증을 한 겹 더 갈랐습니다 — 삭제용 아이콘 번호는
# 정보 수정용과 다릅니다. 같은 번호를 쓰면 정보를 고치려고 아이콘을 바꿔 둔 선수를
# 같은 날 남이 지울 수 있게 됩니다 (scripts/riot.py 의 challenge_icon_id 참고).
#
# game 이 비어 오면 전체 삭제, 종목 코드가 오면 그 종목만 등록 해지입니다.
on:
  repository_dispatch:
    types: [remove-player]

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 아이콘 인증 후 삭제
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          IN_RIOT_ID: ${{ github.event.client_payload.riotId }}
          IN_GAME: ${{ github.event.client_payload.game }}
        run: |
          set -o pipefail
          # 종목이 비어 있으면 전체 삭제입니다.
          SCOPE=""
          if [ -n "$IN_GAME" ]; then SCOPE="--game $IN_GAME"; fi
          python scripts/self_remove.py --riot-id "$IN_RIOT_ID" $SCOPE 2>&1 | tee /tmp/remove-out.txt

      # 로그를 펼치지 않아도 실행 요약 화면에서 결과를 바로 볼 수 있게 합니다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 등록 삭제 결과"
            echo ""
            echo '```'
            cat /tmp/remove-out.txt 2>/dev/null || echo "(스크립트가 실행되기 전에 중단되었습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # self_remove.py 가 랭킹·기록까지 정리하므로 갱신(API 호출)은 필요 없습니다.
      - name: 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --staged --quiet || git commit -m "chore: 선수 본인 등록 삭제"
          git push

  # 데이터 커밋만으로는 Pages 배포가 걸리지 않으므로 직접 호출합니다.
  deploy:
    needs: remove
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/deploy-pages.yml
