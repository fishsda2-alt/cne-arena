name: 사이트 자동 등록

# 등록 페이지에서 선수가 제출하면 Google Apps Script가 이 워크플로를 깨웁니다.
# (Apps Script만 토큰을 가지고 있으므로 아무나 호출할 수 없습니다)
#
# 들어오는 값은 외부 입력이므로 반드시 env로 전달합니다 — run: 안에 ${{ }}를 직접 쓰면
# 셸 명령이 주입될 수 있습니다.
#
# ⚠ 실명·연락처는 이 경로로 받지 않습니다. 실행 기록이 공개되기 때문입니다.
#   프로 트라이아웃 신청은 이메일로만 받습니다 (pro.html 참고).
on:
  repository_dispatch:
    types: [register-player]

concurrency:
  group: ranking-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  register:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 아이콘 인증 후 등록
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
          IN_RIOT_ID: ${{ github.event.client_payload.riotId }}
          IN_NAME: ${{ github.event.client_payload.nickname }}
          IN_REGION: ${{ github.event.client_payload.region }}
          IN_POSITION: ${{ github.event.client_payload.position }}
          IN_TEAM: ${{ github.event.client_payload.team }}
        run: |
          set -o pipefail
          python scripts/add_player.py \
            --riot-id "$IN_RIOT_ID" \
            --name "$IN_NAME" \
            --region "$IN_REGION" \
            --position "$IN_POSITION" \
            --team "$IN_TEAM" 2>&1 | tee /tmp/register-out.txt

      # 로그를 펼치지 않아도 실행 요약 화면에서 결과를 바로 볼 수 있게 합니다.
      - name: 결과 요약
        if: always()
        run: |
          {
            echo "### 등록 결과"
            echo ""
            echo '```'
            cat /tmp/register-out.txt 2>/dev/null || echo "(스크립트가 실행되기 전에 중단되었습니다)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 커밋 후 랭킹 즉시 반영
        env:
          RIOT_API_KEY: ${{ secrets.RIOT_API_KEY }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/players.json
          git diff --staged --quiet || git commit -m "chore: 사이트에서 선수 자동 등록"
          python scripts/update_ranking.py
          git add data/ranking.json data/history
          git diff --staged --quiet || git commit -m "chore: 랭킹 갱신(자동 등록)"
          git push
